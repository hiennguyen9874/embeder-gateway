[project]
name = "embedder-gateway"
version = "0.1.0"
description = "OpenAI/Cohere-compatible gateway for multimodal embedding and rerank models served by llama.cpp"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "httpx",
    "pillow>=13.0.0",
    "pyyaml",
    "uvicorn",
]

[project.scripts]
gateway = "gateway.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: needs a real llama-server router on a GPU (opt-in: pytest -m gpu)"]
addopts = "-m 'not gpu'"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]
